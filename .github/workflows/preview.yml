name: Build SadawVPN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK & NDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$SDK_ROOT
          export ANDROID_SDK_ROOT=$SDK_ROOT
          
          # Ищем sdkmanager, где бы он ни лежал
          SDKMANAGER=$(find $SDK_ROOT -name sdkmanager | head -n 1)
          export PATH=$PATH:$(dirname $SDKMANAGER):$SDK_ROOT/platform-tools
          
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$(dirname $SDKMANAGER)" >> $GITHUB_PATH
          
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "ndk;26.1.10909125" || true
          
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Fix Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Build APK (Gradle auto-builds libcore)
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePreviewRelease --no-daemon

      - name: Rename to SadawVPN.apk
        run: |
          find app/build/outputs/apk/previewRelease -name "*.apk" -exec mv {} SadawVPN.apk \;

      - name: Upload SadawVPN
        uses: actions/upload-artifact@v4
        with:
          name: SadawVPN
          path: SadawVPN.apk
