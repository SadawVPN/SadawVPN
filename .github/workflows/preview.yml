name: Build SadawVPN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android SDK & NDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$SDK_ROOT
          export ANDROID_SDK_ROOT=$SDK_ROOT
          export ANDROID_NDK_ROOT=$SDK_ROOT/ndk/26.1.10909125
          
          SDKMANAGER=$(find $SDK_ROOT -name sdkmanager | head -n 1)
          export PATH=$PATH:$(dirname $SDKMANAGER):$SDK_ROOT/platform-tools
          
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" || true
          
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "ndk.dir=$SDK_ROOT/ndk/26.1.10909125" >> local.properties

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "$(dirname $SDKMANAGER)" >> $GITHUB_PATH

      - name: Build Custom Gomobile
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          git clone --depth=1 https://github.com/MatsuriDayo/gomobile.git /tmp/gomobile-fork
          cd /tmp/gomobile-fork
          go mod tidy || true
          go build -o $(go env GOPATH)/bin/gomobile ./cmd/gomobile
          go build -o $(go env GOPATH)/bin/gobind ./cmd/gobind
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Clone ALL dependencies (Correct Paths)
        run: |
          git clone --depth=1 https://github.com/MatsuriDayo/libneko.git /home/runner/work/SadawVPN/libneko
          git clone --depth=1 https://github.com/MatsuriDayo/sing-box.git /home/runner/work/SadawVPN/sing-box
          git clone --depth=1 https://github.com/sagernet/cloudflare-tls.git /home/runner/work/SadawVPN/cloudflare-tls

      - name: Build Libcore (VPN Engine)
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mkdir -p app/libs
          cd libcore
          
          go mod edit -replace github.com/sagernet/sing-box=../../sing-box
          go mod edit -replace github.com/matsuridayo/libneko=../../libneko
          go mod edit -replace github.com/sagernet/cloudflare-tls=../../cloudflare-tls
          
          go mod download
          
          gomobile bind -v -androidapi 21 -target android/arm64 \
            -tags "with_quic,with_wireguard,with_utls,with_clash_api,with_gvisor,with_naive_outbound,with_naive_inbound" \
            -o ../app/libs/libcore.aar

      - name: Optimize Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePreviewRelease --no-daemon

      - name: Rename to SadawVPN.apk safely
        run: |
          APK=$(find app/build/outputs/apk/previewRelease -name "*.apk" | head -n 1)
          mv "$APK" SadawVPN.apk

      - name: Upload SadawVPN
        uses: actions/upload-artifact@v4
        with:
          name: SadawVPN
          path: SadawVPN.apk
