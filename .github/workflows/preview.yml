name: Build SadawVPN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Android SDK & NDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$SDK_ROOT
          export ANDROID_SDK_ROOT=$SDK_ROOT
          SDKMANAGER=$(find $SDK_ROOT -name sdkmanager | head -n 1)
          export PATH=$PATH:$(dirname $SDKMANAGER):$SDK_ROOT/platform-tools
          
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" || true
          
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "ndk.dir=$SDK_ROOT/ndk/26.1.10909125" >> local.properties

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "$(dirname $SDKMANAGER)" >> $GITHUB_PATH

      - name: Build Libcore (VPN Engine)
        run: |
          chmod +x run gradlew
          export PATH=$PATH:$(go env GOPATH)/bin
          ./run lib core
          ls -lh app/libs/libcore.aar

      - name: Build APK (Unsigned)
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePreviewRelease --no-daemon

      - name: Find, Zipalign and Sign APK
        run: |
          echo ">>> Ищем APK в папке сборки..."
          # Ищем ЛЮБОЙ apk, который еще не подписан нами
          APK=$(find app/build/outputs -name "*.apk" -not -name "*-aligned.apk" -not -name "*-signed.apk" | head -n 1)
          
          if [ -z "$APK" ]; then
            echo "::error::APK не найден вообще! Вывожу список всех файлов в app/build:"
            find app/build -name "*.apk" -type f || true
            exit 1
          fi
          
          echo "✅ Найден исходный APK: $APK"
          
          # Ищем утилиты
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | head -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1)
          
          echo ">>> Zipalign..."
          $ZIPALIGN -v -p 4 "$APK" app-aligned.apk
          
          echo ">>> Подписываем APK локальным ключом sadaw.keystore..."
          $APKSIGNER sign \
            --ks sadaw.keystore \
            --ks-key-alias sadaw \
            --ks-pass "pass:sadaw123" \
            --key-pass "pass:sadaw123" \
            --out SadawVPN.apk \
            app-aligned.apk
          
          echo ">>> Проверка подписи:"
          $APKSIGNER verify --verbose SadawVPN.apk

      - name: Upload SadawVPN
        uses: actions/upload-artifact@v4
        with:
          name: SadawVPN
          path: SadawVPN.apk
