name: Build SadawVPN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK & NDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Ensure Go PATH is visible
        run: |
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "$(go env GOROOT)/bin" >> $GITHUB_PATH

      - name: Init custom gomobile-matsuri
        run: |
          cd libcore
          chmod +x init.sh
          bash init.sh

      - name: Build libcore.aar
        run: |
          cd libcore
          chmod +x build.sh
          bash build.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePreviewRelease

      - name: Rename to SadawVPN.apk
        run: |
          find app/build/outputs/apk/previewRelease -name "*.apk" -exec mv {} SadawVPN.apk \;

      - name: Upload SadawVPN
        uses: actions/upload-artifact@v4
        with:
          name: SadawVPN
          path: SadawVPN.apk
