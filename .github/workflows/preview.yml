name: Build SadawVPN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android SDK & NDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$SDK_ROOT
          export ANDROID_SDK_ROOT=$SDK_ROOT
          SDKMANAGER=$(find $SDK_ROOT -name sdkmanager | head -n 1)
          export PATH=$PATH:$(dirname $SDKMANAGER):$SDK_ROOT/platform-tools
          
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" || true
          
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "ndk.dir=$SDK_ROOT/ndk/26.1.10909125" >> local.properties

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "$(dirname $SDKMANAGER)" >> $GITHUB_PATH

      - name: Install Gomobile Fork manually
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          git clone https://github.com/MatsuriDayo/gomobile.git gomobile-fork
          cd gomobile-fork
          go install ./cmd/gomobile
          go install ./cmd/gobind
          cd ..
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Init Gomobile
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Clone libneko & sing-box (replace-пути из go.mod)
        run: |
          # Клонируем ОБА репозитория на уровень выше, как требует go.mod
          git clone --depth=1 https://github.com/MatsuriDayo/libneko.git ../libneko
          git clone --depth=1 -b main https://github.com/MatsuriDayo/sing-box.git ../sing-box

      - name: Build Libcore (VPN Engine)
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mkdir -p app/libs
          cd libcore
          
          go mod download
          
          # Добавлены теги with_dhcp и with_dns
          gomobile bind -v -androidapi 21 -target android/arm64 \
            -tags "with_quic,with_wireguard,with_utls,with_clash_api,with_gvisor,with_naive_outbound,with_naive_inbound,with_dhcp,with_dns" \
            -o ../app/libs/libcore.aar

      - name: Optimize Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePreviewRelease --no-daemon

      - name: Rename to SadawVPN.apk safely
        run: |
          APK=$(find app/build/outputs/apk/previewRelease -name "*.apk" | head -n 1)
          mv "$APK" SadawVPN.apk

      - name: Upload SadawVPN
        uses: actions/upload-artifact@v4
        with:
          name: SadawVPN
          path: SadawVPN.apk
