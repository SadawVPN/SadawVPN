name: Build SadawVPN

on:
  workflow_dispatch:

# Новый запуск отменяет предыдущий, чтобы не копились зависшие сборки
concurrency:
  group: build-sadawvpn
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest с 19.10.2026 переезжает на Ubuntu 26 -> пинним 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25' # старый '1.23' мог быть слишком старым для ядра sing-box
          cache: false # в корне нет go.sum -> кэш Go падал с warning

      - name: Setup Android SDK & NDK
        run: |
          NDK_VERSION=26.1.10909125
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found in $SDK_ROOT"; exit 1; }

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # без "|| true": если NDK не поставился, сборка должна упасть здесь, а не позже
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0"
          test -d "$SDK_ROOT/ndk/$NDK_VERSION"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VERSION"
          } >> "$GITHUB_ENV"

          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "ndk.dir=$SDK_ROOT/ndk/$NDK_VERSION" >> local.properties

      - name: Restore libcore cache
        id: libcore-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('buildScript/**', 'libcore/**') }}

      # Родной скрипт проекта: клонирует sing-box/libneko на НУЖНЫХ коммитах,
      # ставит gomobile-matsuri и собирает app/libs/libcore.aar с правильными тегами.
      # Раньше тут были клоны HEAD без фиксации версий -> несовместимые исходники.
      - name: Build libcore (VPN engine)
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x run gradlew
          find buildScript libcore -name '*.sh' -exec chmod +x {} +
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./run lib core
          ls -lh app/libs/libcore.aar

      - name: Download assets
        run: |
          if [ -x buildScript/init/action/gradle.sh ]; then
            ./run init action gradle || echo "::warning::asset download failed"
          fi

      # ВАЖНО: gradle.properties больше не перезаписывается.
      # Старый шаг стирал android.enableJetifier / nonTransitiveRClass=false
      # (-Xmx4g уже есть в самом файле репозитория).
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePreviewRelease --no-daemon --stacktrace

      - name: Rename to SadawVPN.apk
        run: |
          # папка вывода: apk/preview/release/, а не apk/previewRelease/ -> ищем по всему apk/
          APK="$(find app/build/outputs/apk -name '*arm64*.apk' 2>/dev/null | head -n 1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk -name '*.apk' 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::APK not found"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "Using: $APK"
          cp "$APK" SadawVPN.apk

      - name: Upload SadawVPN
        uses: actions/upload-artifact@v4
        with:
          name: SadawVPN
          path: SadawVPN.apk
          if-no-files-found: error