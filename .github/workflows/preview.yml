name: Build SadawVPN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK Env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;26.1.10909125"

      - name: Build Libcore (VPN Engine)
        run: |
          chmod +x ./run
          ./run init action gomobile
          ./run libcore

      - name: Build APK
        run: ./gradlew :app:assemblePreviewRelease

      - name: Rename to SadawVPN.apk
        run: |
          find app/build/outputs/apk/previewRelease -name "*.apk" -exec mv {} SadawVPN.apk \;

      - name: Upload SadawVPN
        uses: actions/upload-artifact@v4
        with:
          name: SadawVPN
          path: SadawVPN.apk
